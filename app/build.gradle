plugins {
    id 'com.android.application'
}

android {
    namespace 'com.test.island'
    compileSdk 34

    defaultConfig {
        applicationId "com.test.island"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Библиотеки не нужны, мы используем только встроенные средства Android
}
